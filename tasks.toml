# This module publishes to a public mirror, so `publish-validate` checks
# it with `GOWORK=off go mod tidy -diff`, and `generate` re-tidies only
# modules that own a tidy task — see specs/publish.md.

[[task]]
  id = "dev"
  type = "long"
  dependencies = ["build"]
  triggers = ["build"]
  cmd = "../../bin/piano-alone"

[[task]]
  id = "build"
  type = "short"
  watch = ["**/*.go", "*.go"]
  dependencies = ["templ", "build-css", "wasm"]
  cmd = "go build -o ../../bin/piano-alone ."

[[task]]
  id = "templ"
  type = "short"
  watch = ["**/*.templ"]
  cmd = "go tool templ generate"

# The player is a Go program compiled to wasm and embedded, so the
# server binary carries the client it serves. Both flags are the
# monorepo's hard-won ones (pkg/hermit/tasks.toml): -buildvcs=false
# because the VCS stamp bakes the current commit into the wasm, which
# in a colocated checkout busts Go's test cache on every commit; and
# cp -f because GOROOT's wasm_exec.js is mode 444, so a plain cp cannot
# overwrite what the last run left.
#
# -ldflags "-s -w" strips DWARF and the name section. It costs browser
# stack-trace symbols and saves about a fifth of a 10 MB download that
# an audience fetches on phones, at a venue, at the same moment.
[[task]]
  id = "wasm"
  type = "short"
  watch = ["gameplayer/**/*.go", "game/**/*.go", "c2d/*.go", "canvas/*.go", "jsws/*.go", "notefreqs/*.go", "storage/*.go", "baseurl/*.go"]
  cmd = """
    set -e
    GOOS=js GOARCH=wasm go build -buildvcs=false -ldflags="-s -w" -o "$PWD/assets/files/main.wasm" ./gameplayer
    cp -f "$(go env GOROOT)/lib/wasm/wasm_exec.js" assets/files/wasm_exec.js
  """

[[task]]
  id = "build-css"
  type = "short"
  watch = ["css/**", "templates/*.templ", "gameplayer/*.go"]
  dependencies = ["install-css"]
  cmd = "./node_modules/.bin/postcss -o assets/files/style.css css/style.css"

# npm ci rather than npm install: this runs inside CI's generate, where
# a lockfile rewrite — an npm that decides to migrate lockfileVersion,
# say — would fail check-for-diff on churn nobody authored.
[[task]]
  id = "install-css"
  type = "short"
  cmd = "npm ci"

[[task]]
  id = "tidy"
  type = "short"
  dependencies = ["templ"]
  cmd = "go mod tidy -e"

[[task]]
  id = "generate"
  type = "short"
  dependencies = ["tidy", "templ", "build-css", "wasm"]

# The macOS client that drives the disklavier: a signed, notarized
# universal binary. It is built by hand on a Mac and handed to a
# running server as a file (the -client flag), because notarization
# needs Apple's toolchain and a signing identity, and the builder is
# linux. Needs $APP_SPECIFIC_PASSWORD and a keychain holding the
# Developer ID certificate.
[[task]]
  id = "build-client"
  type = "short"
  cmd = """
    set -xeuo pipefail

    CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 \
      go build -o macos-client-amd64 ./gamecontroller
    CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
      go build -o macos-client-arm64 ./gamecontroller

    lipo \
      -output ./macos-client-universal \
      -create ./macos-client-arm64 ./macos-client-amd64

    rm ./macos-client-arm64 ./macos-client-amd64

    codesign \
      --keychain buildagent \
      -s 'Developer ID Application: Andrew Monks (89WR6ARSCL)' \
      --timestamp \
      --options runtime \
      ./macos-client-universal

    /usr/bin/ditto -c -k \
      --keepParent \
      ./macos-client-universal \
      ./macos-client-universal.zip

    xcrun notarytool submit \
      -f json \
      --apple-id a@monks.co \
      --team-id 89WR6ARSCL \
      --password $APP_SPECIFIC_PASSWORD \
      --wait ./macos-client-universal.zip

    rm macos-client-universal.zip
  """
